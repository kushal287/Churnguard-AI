[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard-ai"
version = "1.0.0"
description = "Explainable Customer Churn Prediction & Retention Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "Pillow>=10.0.0",
    "streamlit>=1.28.0"
]

[tool.vercel]
entrypoint = "api/index.py"
