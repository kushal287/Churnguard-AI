<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChurnGuard AI — Explainable Retention Intelligence</title>
  <meta name="description" content="Enterprise-grade explainable machine learning platform for customer churn prediction, log-odds waterfall attribution, and data-driven retention intelligence." />
  <link rel="icon" type="image/png" href="./app/assets/favicon.png" />
  <link rel="shortcut icon" type="image/x-icon" href="./app/assets/favicon.ico" />
  <link rel="apple-touch-icon" href="./app/assets/logo.png" />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/style.css"
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    /* Premium loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #E0F2FE 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.5s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }

    .loading-logo {
      width: 88px; height: 88px;
      border-radius: 18px;
      border: 2px solid #BAE6FD;
      padding: 8px;
      background: #FFFFFF;
      box-shadow: 0 8px 30px rgba(37, 99, 235, 0.12);
      animation: logoPulse 2s infinite ease-in-out;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 30px rgba(37, 99, 235, 0.12); }
      50% { transform: scale(1.04); box-shadow: 0 12px 40px rgba(37, 99, 235, 0.2); }
    }

    .loading-title {
      margin-top: 22px;
      font-size: 24px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
    }
    .loading-subtitle {
      margin-top: 8px;
      font-size: 14px;
      color: #475569;
    }

    .loading-bar-container {
      margin-top: 28px;
      width: 280px;
      height: 6px;
      background: #E2E8F0;
      border-radius: 6px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563EB, #06B6D4);
      border-radius: 6px;
      animation: loadProgress 12s ease-out forwards;
    }
    @keyframes loadProgress {
      0% { width: 0%; }
      15% { width: 20%; }
      40% { width: 45%; }
      60% { width: 60%; }
      80% { width: 78%; }
      95% { width: 90%; }
      100% { width: 95%; }
    }

    .loading-status {
      margin-top: 14px;
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
    }

    .loading-features {
      margin-top: 32px;
      display: flex;
      gap: 14px;
    }
    .loading-feature {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 12px;
      color: #334155;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    /* stlite app container */
    #root { height: 100vh; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <img src="./app/assets/logo.png" alt="ChurnGuard AI" class="loading-logo" />
    <div class="loading-title">ChurnGuard AI</div>
    <div class="loading-subtitle">Initializing Explainable ML Engine...</div>
    <div class="loading-bar-container">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-status" id="loading-status">Loading Python runtime...</div>
    <div class="loading-features">
      <div class="loading-feature">⚙️ NumPy ML Engine</div>
      <div class="loading-feature">🧬 Log-Odds Waterfall</div>
      <div class="loading-feature">📊 Executive Analytics</div>
    </div>
  </div>

  <!-- Stlite App Mount Point -->
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

    const statusEl = document.getElementById("loading-status");
    const loadingScreen = document.getElementById("loading-screen");

    function updateStatus(msg) {
      if (statusEl) statusEl.textContent = msg;
    }

    // ─── Step 1: Fetch the manifest ─────────────────────────────────────
    updateStatus("Downloading application manifest...");
    const manifestResp = await fetch("./stlite_build/manifest.json");
    const manifest = await manifestResp.json();

    // ─── Step 2: Build the files dictionary for stlite ──────────────────
    updateStatus("Preparing source files...");
    const files = {};

    // Text files (Python source, CSV data, TOML configs)
    for (const [path, content] of Object.entries(manifest.text_files)) {
      files[path] = content;
    }

    // Binary files (model artifacts, images) — decode from base64 to Uint8Array
    for (const [path, b64] of Object.entries(manifest.binary_files)) {
      const binaryStr = atob(b64);
      const bytes = new Uint8Array(binaryStr.length);
      for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      files[path] = { data: bytes };
    }

    // ─── Step 3: Mount the Streamlit application ────────────────────────
    updateStatus("Starting Streamlit engine...");

    await mount(
      {
        requirements: [
          "numpy",
          "pandas",
          "scikit-learn",
          "scipy",
          "matplotlib",
          "seaborn",
          "joblib",
          "Pillow",
        ],
        entrypoint: "app/streamlit_app.py",
        files: files,
      },
      document.getElementById("root"),
      {
        onProgress: (message) => {
          updateStatus(message.text || "Loading...");
        },
        onLoad: () => {
          // Hide loading screen with fade animation
          loadingScreen.classList.add("fade-out");
          setTimeout(() => {
            loadingScreen.style.display = "none";
          }, 600);
        },
      }
    );
  </script>
</body>
</html>
